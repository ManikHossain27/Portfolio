name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn on Pages (build type: GitHub Actions) if it isn't already
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site lives at the repo root (index.html, css/, js/, blog/, assets/)
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
